name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-checks:
    name: installer + release contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck
      - run: node app/scripts/version.mjs check
      - run: node --test app/scripts/version.test.mjs
      - run: node --test packaging/installer/check-os-release.test.mjs
      - run: node packaging/installer/installer.test.mjs
      - run: node packaging/release/release-contract.test.mjs
      - run: node packaging/release/publish.test.mjs
      - run: node packaging/deb/verify.test.mjs
      - run: node --test packaging/rpm/build-script.test.mjs packaging/rpm/metadata.test.mjs
      - run: node --test packaging/arch/build-script.test.mjs packaging/arch/metadata.test.mjs
      - run: >
          shellcheck install.sh packaging/install-from-source.sh
          packaging/installer/check-os-release.sh packaging/deb/verify.sh
          packaging/arch/build.sh packaging/arch/verify.sh packaging/rpm/build.sh
          packaging/rpm/verify.sh packaging/release/publish.sh

  debs:
    name: build .deb packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - run: >
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          libayatana-appindicator3-dev libudev-dev
      - uses: Swatinem/rust-cache@v2
      - name: Build fangd .deb
        run: |
          cargo install cargo-deb --locked
          cargo deb -p fangd
      - name: Build app .deb
        working-directory: app
        run: |
          npm ci
          npm run tauri -- build --bundles deb
      - name: Collect .deb packages
        run: |
          mkdir -p target/deb-dist
          rm -f target/deb-dist/*.deb
          mapfile -t daemon_debs < <(find target/debian -maxdepth 1 -type f -name '*.deb' -print | sort)
          mapfile -t app_debs < <(find app/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' -print | sort)
          test "${#daemon_debs[@]}" -eq 1
          test "${#app_debs[@]}" -eq 1
          cp "${daemon_debs[@]}" "${app_debs[@]}" target/deb-dist/
          mapfile -t debs < <(find target/deb-dist -maxdepth 1 -type f -name '*.deb' -print | sort)
          test "${#debs[@]}" -eq 2
      - uses: actions/upload-artifact@v4
        with:
          name: fang-debs
          path: target/deb-dist/*.deb
          if-no-files-found: error

  deb-test:
    name: test DEBs (${{ matrix.image }})
    needs: debs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu:22.04, ubuntu:24.04, ubuntu:26.04, debian:12, debian:13]
    container:
      image: ${{ matrix.image }}
    steps:
      - run: >
          apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y
          git ca-certificates systemd python3 dbus-x11 xvfb xauth
          desktop-file-utils procps
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: os-release projection still matches this image
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          case "$IMAGE" in
            ubuntu:22.04) expected_platform='Ubuntu 22.04' ;;
            ubuntu:24.04) expected_platform='Ubuntu 24.04' ;;
            ubuntu:26.04) expected_platform='Ubuntu 26.04' ;;
            debian:12) expected_platform='Debian 12' ;;
            debian:13) expected_platform='Debian 13' ;;
            *) echo "unsupported installer test image: $IMAGE" >&2; exit 1 ;;
          esac
          capture_name="${IMAGE%%:*}-${IMAGE#*:}"
          packaging/installer/check-os-release.sh "$capture_name" "$expected_platform"
      - uses: actions/download-artifact@v4
        with:
          name: fang-debs
          path: target/deb-dist
      - run: packaging/deb/verify.sh target/deb-dist

  rpms:
    name: build RPMs (Fedora 43)
    runs-on: ubuntu-latest
    container: fedora:43
    steps:
      - run: >
          dnf install -y
          git curl tar gzip gcc gcc-c++ make pkgconf-pkg-config systemd-devel
          webkit2gtk4.1-devel gtk3-devel librsvg2-devel
          libayatana-appindicator-gtk3-devel openssl-devel
          rpm-build desktop-file-utils findutils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            app/src-tauri
      - run: packaging/rpm/build.sh target/rpm-dist
      - uses: actions/upload-artifact@v4
        with:
          name: fang-rpms
          path: target/rpm-dist/*.rpm
          if-no-files-found: error

  rpm-test:
    name: test RPMs (${{ matrix.fedora }})
    needs: rpms
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        fedora: [43, 44]
    container:
      image: fedora:${{ matrix.fedora }}
    steps:
      - run: >
          dnf install -y
          git tar gzip rpm-build systemd systemd-rpm-macros desktop-file-utils
          python3 dbus-daemon xorg-x11-server-Xvfb xorg-x11-xauth
          libayatana-appindicator-gtk3 findutils procps-ng diffutils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: os-release projection still matches this image
        run: >
          packaging/installer/check-os-release.sh "fedora-${{ matrix.fedora }}"
          "Fedora ${{ matrix.fedora }}"
      - uses: actions/download-artifact@v4
        with:
          name: fang-rpms
          path: target/rpm-dist
      - run: packaging/rpm/verify.sh target/rpm-dist

  arch-packages:
    name: build Pacman packages (Arch)
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: >
          pacman -Syu --noconfirm
          git nodejs-lts-jod npm rust webkit2gtk-4.1 gtk3 librsvg
          libayatana-appindicator systemd-libs openssl pkgconf libarchive
          desktop-file-utils
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: useradd --create-home builder && chown -R builder:builder "$GITHUB_WORKSPACE"
      - run: runuser -u builder -- env PATH="$PATH" packaging/arch/build.sh target/arch-dist
      - uses: actions/upload-artifact@v4
        with:
          name: fang-arch-packages
          path: target/arch-dist/*.pkg.tar.zst
          if-no-files-found: error

  arch-test:
    name: test Pacman packages (${{ matrix.name }})
    needs: arch-packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Arch Linux
            image: archlinux:base-devel
            capture: arch-container
            platform: Arch Linux
            disable_sandbox_network: false
          - name: CachyOS
            image: cachyos/cachyos:latest
            capture: cachyos-container
            platform: CachyOS
            disable_sandbox_network: true
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install Pacman verification tools
        env:
          DISABLE_PACMAN_SANDBOX_NETWORK: ${{ matrix.disable_sandbox_network }}
        run: |
          if [[ "$DISABLE_PACMAN_SANDBOX_NETWORK" == true ]]; then
            sed -i '/^\[options\]/a DisableSandboxNetwork' /etc/pacman.conf
          fi
          pacman -Syu --noconfirm \
            git systemd python dbus xorg-server-xvfb xorg-xauth \
            desktop-file-utils procps-ng diffutils namcap libarchive util-linux
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: os-release projection still matches this image
        run: >
          packaging/installer/check-os-release.sh
          "${{ matrix.capture }}" "${{ matrix.platform }}"
      - uses: actions/download-artifact@v4
        with:
          name: fang-arch-packages
          path: target/arch-dist
      - run: useradd --create-home fangtest
      - run: packaging/arch/verify.sh target/arch-dist fangtest

  publish:
    name: publish immutable eight-asset release
    needs: [release-checks, debs, deb-test, rpms, rpm-test, arch-packages, arch-test]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: fang-debs
          path: dist/deb
      - uses: actions/download-artifact@v4
        with:
          name: fang-rpms
          path: dist/rpm
      - uses: actions/download-artifact@v4
        with:
          name: fang-arch-packages
          path: dist/arch
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Stage exact release inventory
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm libarchive-tools
          node app/scripts/version.mjs check
          version="$(node -p "require('./app/package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            printf 'release tag %s does not match manifest version v%s\n' "$GITHUB_REF_NAME" "$version" >&2
            exit 1
          fi
          node packaging/release/release-contract.mjs stage \
            "$version" dist/deb dist/rpm dist/arch dist/release install.sh
      - name: Publish one immutable release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          IMMUTABLE_RELEASES_TOKEN: ${{ secrets.IMMUTABLE_RELEASES_TOKEN }}
        run: packaging/release/publish.sh dist/release "$GITHUB_REF_NAME"
